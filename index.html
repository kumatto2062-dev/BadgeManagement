<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6c5ce7">
<title>ファン鯖 メンバー管理</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='17' fill='%236c5ce7'/%3E%3Cpath d='m32 10 6.5 13.2L53 25.3 42.5 35.5 45 50 32 43.2 19 50l2.5-14.5L11 25.3l14.5-2.1z' fill='%23ffd166'/%3E%3C/svg%3E">
<style>
:root{--purple:#6c5ce7;--ink:#25213a;--line:#e5e2ef;--muted:#79738f}*{box-sizing:border-box}body{margin:0;background:#f7f8fc;color:var(--ink);font-family:"Yu Gothic UI","Hiragino Kaku Gothic ProN",sans-serif}.header{background:#fff;border-bottom:1px solid #e8e6f0}.header-inner{max-width:1100px;margin:auto;padding:16px 20px;display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:15px;background:var(--purple);color:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 8px 24px #6c5ce744}.header h1{font-size:20px;margin:0}.header p{font-size:14px;color:var(--muted);margin:2px 0 0}.sync{margin-left:auto;font-size:13px;font-weight:700;color:#777083}.sync.online{color:#16865e}.sync.error{color:#c33}.container{max-width:1100px;margin:auto;padding:30px 20px}.month-row{display:grid;grid-template-columns:1fr auto;gap:12px;margin-bottom:20px}.month-picker{background:#fff;border:1px solid var(--line);border-radius:18px;display:flex;align-items:center;justify-content:space-between;padding:8px;box-shadow:0 4px 15px #362e5a0c}.month-picker button{border:0;background:transparent;width:44px;height:44px;border-radius:12px;color:#655c79;font-size:30px;cursor:pointer}.month-picker button:hover{background:#f1eeff}.secondary{border:1px solid #ded9ec;background:#fff;border-radius:16px;padding:0 22px;color:#5e5676;font-weight:700;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}.summary article{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 20px;display:flex;align-items:center;gap:14px}.summary-icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:22px;font-weight:900}.purple{background:#eeeaff;color:var(--purple)}.gold{background:#fff4ce;color:#b67800}.green{background:#dcf8ec;color:#16865e}.summary small{display:block;color:#7d778e;font-weight:700}.summary strong{display:block;font-size:23px;margin-top:2px}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.8fr);gap:20px;align-items:start}.member-card{background:#fff;border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 14px 40px #362e5a0f}.member-head{padding:22px;border-bottom:1px solid #eeeaf5}.member-head h2,.invite-head h2{margin:0;font-size:20px}.member-head p{margin:5px 0 16px;color:var(--muted);font-size:14px}.member-head form{display:flex;gap:8px}.member-head input{min-width:0;width:100%;border:1px solid #dcd7e9;background:#fbfaff;border-radius:14px;padding:13px 15px;font-size:16px;outline:none}.member-head input:focus{border-color:#7766ea;box-shadow:0 0 0 4px #7766ea16}.member-head form button{border:0;border-radius:14px;background:var(--purple);color:#fff;padding:0 22px;font-weight:800;white-space:nowrap;cursor:pointer}.search{margin-top:12px!important;background:#f8f7fb!important}.member-row{display:grid;grid-template-columns:minmax(130px,1fr) auto auto;gap:12px;align-items:center;padding:16px 22px;border-bottom:1px solid #f0edf5}.member-name{font-weight:800;overflow:hidden;text-overflow:ellipsis}.status-chip{display:block;width:max-content;margin-top:5px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700}.status-not_invited{background:#f0eef4;color:#777083}.status-invited{background:#e9e5ff;color:#5f50c3}.status-joined{background:#dff8ee;color:#167b59}.status-left{background:#ffebec;color:#bd3d50}.stars{display:flex;gap:6px}.star{border:1px solid #ddd8e9;background:#fff;color:#8b8499;border-radius:12px;padding:10px;font-weight:800;cursor:pointer}.star.active{border-color:#f0bd39;background:#ffd166;color:#3f3107}.member-actions{display:flex;gap:7px;align-items:center}.member-actions select{border:1px solid #ddd8e9;border-radius:12px;background:#fff;padding:10px;font-size:15px;font-weight:700}.delete{border:0;background:transparent;color:#aaa4b6;font-size:20px;cursor:pointer}.empty{text-align:center;padding:45px 20px;color:#89839b}.invite-card{background:#262039;color:#fff;border-radius:26px;padding:22px;box-shadow:0 18px 48px #2620392e;position:sticky;top:20px}.invite-head{display:flex;justify-content:space-between}.invite-head small{color:#bdb5d4;font-weight:700}.invite-head b{background:#ffd166;color:#392f10;border-radius:99px;padding:7px 12px;height:max-content}.invite-list{display:grid;gap:8px;margin-top:18px}.invite-person{background:#ffffff14;border-radius:16px;padding:13px 15px;display:flex;justify-content:space-between;align-items:center}.invite-person strong{display:block}.invite-person small{color:#c8c1d9}.invite-person b{background:#ffd166;color:#3e3210;border-radius:12px;padding:7px 10px}.invite-empty{border:1px solid #ffffff18;background:#ffffff0d;border-radius:16px;padding:24px;text-align:center;color:#bbb4cc}.status-summary{border-top:1px solid #ffffff18;margin-top:20px;padding-top:12px;color:#c8c1d9;font-size:14px}.status-summary>p{font-weight:700}.status-summary>div{display:flex;justify-content:space-between}.toast{position:fixed;left:50%;top:20px;transform:translate(-50%,-120px);opacity:0;background:#25213a;color:#fff;padding:12px 18px;border-radius:13px;box-shadow:0 12px 35px #0003;transition:.25s;z-index:10}.toast.show{transform:translate(-50%,0);opacity:1}.toast.error{background:#b9364b}@media(max-width:800px){.layout{grid-template-columns:1fr}.invite-card{position:static}.member-row{grid-template-columns:1fr}.summary article{padding:12px}.summary-icon{width:40px;height:40px}.member-actions select{flex:1}.month-row{grid-template-columns:1fr}.secondary{padding:13px}}@media(max-width:480px){.container{padding:20px 12px}.summary{gap:7px}.summary article{justify-content:center;text-align:center}.summary-icon{display:none}.summary strong{font-size:20px}.member-head,.member-row{padding:16px}.star{flex:1}.stars{width:100%}.header-inner{padding:13px}.sync{font-size:11px}}
</style>
</head>
<body>
<header class="header"><div class="header-inner"><div class="logo">★</div><div><h1>ファン鯖 メンバー管理</h1><p>IRIAM × Discord</p></div><span id="syncState" class="sync">接続中…</span></div></header>
<main class="container">
  <section class="month-row"><div class="month-picker"><button id="prevMonth" aria-label="前の月">‹</button><strong id="monthLabel"></strong><button id="nextMonth" aria-label="次の月">›</button></div><button id="currentMonth" class="secondary">今月を表示</button></section>
  <section class="summary"><article><span class="summary-icon purple">♙</span><div><small>登録者</small><strong><span id="memberCount">0</span>名</strong></div></article><article><span class="summary-icon gold">★</span><div><small>星3以上</small><strong><span id="qualifiedCount">0</span>名</strong></div></article><article><span class="summary-icon green">✓</span><div><small>参加中</small><strong><span id="joinedCount">0</span>名</strong></div></article></section>
  <div class="layout">
    <section class="member-card"><div class="member-head"><h2>登録メンバー</h2><p>星を押すだけで、この月の記録を更新できます</p><form id="addForm"><input id="nameInput" maxlength="80" placeholder="新しい名前を入力" autocomplete="off" required><button type="submit">＋ 登録</button></form><input id="searchInput" class="search" placeholder="⌕  名前を検索"></div><div id="memberList"><div class="empty">読み込み中…</div></div></section>
    <aside class="invite-card"><div class="invite-head"><div><small>Discord招待対象</small><h2 id="inviteMonth"></h2></div><b><span id="inviteCount">0</span>名</b></div><div id="inviteList" class="invite-list"></div><div class="status-summary"><p>状態の目安</p><div><span>↪ 参加中 <b id="joinedSide">0</b>名</span><span>↩ 退出済み <b id="leftSide">0</b>名</span></div></div></aside>
  </div>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getDatabase,ref,push,set,update,remove,onValue,get}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyCTQKXadYr21GGdxwW-GB0dl-4hRyelJ0U",
  authDomain:"badge-management-71209.firebaseapp.com",
  databaseURL:"https://badge-management-71209-default-rtdb.firebaseio.com/",
  projectId:"badge-management-71209",
  storageBucket:"badge-management-71209.firebasestorage.app",
  messagingSenderId:"920818331138",
  appId:"1:920818331138:web:9d0c905fac02981135011b",
  measurementId:"G-J4WCTK5FWE"
};

const db=getDatabase(initializeApp(firebaseConfig));
const $=id=>document.getElementById(id);
const labels={not_invited:"未招待",invited:"招待済み",joined:"参加中",left:"退出済み"};
let month=localMonth(),members=[],badges={},stopMembers=null,stopBadges=null;
function localMonth(){const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0");return `${y}-${m}`}
function monthText(v){const[y,m]=v.split("-");return `${y}年 ${Number(m)}月`}
function shift(v,n){const[y,m]=v.split("-").map(Number),d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`}
function esc(v){return String(v).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]))}
function notice(message,isError=false){const el=$("toast");el.textContent=message;el.className=`toast show${isError?" error":""}`;clearTimeout(notice.timer);notice.timer=setTimeout(()=>el.className="toast",2600)}
function online(){$("syncState").textContent="● リアルタイム同期中";$("syncState").className="sync online"}
function failed(error){console.error(error);$("syncState").textContent="同期エラー";$("syncState").className="sync error";notice("通信に失敗しました。Databaseルールを確認してください",true)}
function subscribe(){
  stopMembers?.();stopBadges?.();
  stopMembers=onValue(ref(db,"members"),snap=>{const data=snap.val()||{};members=Object.entries(data).map(([id,v])=>({id,...v})).sort((a,b)=>a.name.localeCompare(b.name,"ja"));render();online()},failed);
  stopBadges=onValue(ref(db,`badges/${month}`),snap=>{badges=snap.val()||{};render();online()},failed);
}
function render(){
  $("monthLabel").textContent=$("inviteMonth").textContent=monthText(month);
  const word=$("searchInput").value.trim().toLowerCase(),filtered=members.filter(m=>m.name.toLowerCase().includes(word)),qualified=members.filter(m=>(badges[m.id]||0)>=3),joined=members.filter(m=>m.discordStatus==="joined").length;
  $("memberCount").textContent=members.length;$("qualifiedCount").textContent=qualified.length;$("joinedCount").textContent=joined;$("inviteCount").textContent=qualified.length;$("joinedSide").textContent=joined;$("leftSide").textContent=members.filter(m=>m.discordStatus==="left").length;
  $("memberList").innerHTML=filtered.length?filtered.map(m=>{const s=badges[m.id]||0;return `<div class="member-row"><div><div class="member-name">${esc(m.name)}</div><span class="status-chip status-${m.discordStatus}">${labels[m.discordStatus]}</span></div><div class="stars">${[3,4,5].map(n=>`<button class="star ${s===n?"active":""}" data-star="${n}" data-id="${m.id}">★${n}</button>`).join("")}</div><div class="member-actions"><select data-status data-id="${m.id}">${Object.entries(labels).map(([v,l])=>`<option value="${v}" ${v===m.discordStatus?"selected":""}>${l}</option>`).join("")}</select><button class="delete" data-delete="${m.id}" data-name="${esc(m.name)}" aria-label="削除">♲</button></div></div>`}).join(""):`<div class="empty">${members.length?"該当する名前がありません":"登録メンバーはいません"}</div>`;
  $("inviteList").innerHTML=qualified.length?qualified.map(m=>`<div class="invite-person"><div><strong>${esc(m.name)}</strong><small>${labels[m.discordStatus]}</small></div><b>★ ${badges[m.id]}</b></div>`).join(""):'<div class="invite-empty">星3以上の方はまだいません</div>';
}
$("prevMonth").onclick=()=>{month=shift(month,-1);subscribe()};$("nextMonth").onclick=()=>{month=shift(month,1);subscribe()};$("currentMonth").onclick=()=>{month=localMonth();subscribe()};$("searchInput").oninput=render;
$("addForm").onsubmit=async e=>{e.preventDefault();const name=$("nameInput").value.trim();if(!name)return;if(members.some(m=>m.name===name)){notice("同じ名前がすでに登録されています",true);return}try{const item=push(ref(db,"members"));await set(item,{name,discordStatus:"not_invited",createdAt:Date.now()});$("nameInput").value="";notice(`${name}さんを登録しました`)}catch(error){failed(error)}};
$("memberList").onclick=async e=>{const star=e.target.closest("[data-star]"),del=e.target.closest("[data-delete]");if(star){const id=star.dataset.id,value=Number(star.dataset.star),target=ref(db,`badges/${month}/${id}`);try{if(Number(badges[id])===value)await remove(target);else await set(target,value)}catch(error){failed(error)}}if(del){const id=del.dataset.delete;if(!confirm(`${del.dataset.name}さんを全ての月の記録から削除しますか？`))return;try{const snap=await get(ref(db,"badges")),all=snap.val()||{},changes={[`members/${id}`]:null};for(const key of Object.keys(all))if(all[key]?.[id]!==undefined)changes[`badges/${key}/${id}`]=null;await update(ref(db),changes);notice("登録を削除しました")}catch(error){failed(error)}}};
$("memberList").onchange=async e=>{const select=e.target.closest("[data-status]");if(!select)return;try{await update(ref(db,`members/${select.dataset.id}`),{discordStatus:select.value,updatedAt:Date.now()})}catch(error){failed(error)}};
render();subscribe();
</script>
</body>
</html>
